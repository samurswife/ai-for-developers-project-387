name: OpenCode Result

on:
  workflow_run:
    workflows: [OpenCode]
    types: [completed]

permissions: {}

concurrency:
  group: opencode-result-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
      issues: write
    steps:
      - name: Publish request result without model
        id: report
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const event = context.payload.workflow_run;
            const { data: workflow } = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'opencode.yml',
            });
            const { data: run } = await github.rest.actions.getWorkflowRunAttempt({
              ...context.repo, run_id: event.id, attempt_number: event.run_attempt,
            });
            const match = /^OpenCode (PR|issue) #([1-9]\d*)$/.exec(run.display_title);
            if (!match || run.workflow_id !== workflow.id || run.path !== '.github/workflows/opencode.yml' ||
                run.head_repository?.full_name !== context.payload.repository.full_name ||
                run.status !== 'completed' || run.id !== event.id || run.run_attempt !== event.run_attempt ||
                !['issue_comment', 'pull_request_review_comment'].includes(run.event)) return;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100,
            });
            const job = jobs.find((entry) => entry.name === 'opencode' && entry.run_attempt === run.run_attempt);
            if (!job) return; // Re-run of only authorize/report did not admit a model request.
            const started = (name) => job.steps?.some((step) => step.name === name && step.started_at &&
              step.status !== 'queued' && step.conclusion !== 'skipped');
            // No comment for bots, rejected commands, or requests cancelled while still queued.
            if (!started('Reserve PR attempt') && !started('Revalidate request')) return;
            if (!started('Reserve PR attempt') && job.conclusion === 'success') return;
            let reason = 'infra';
            if (started('Budget exhausted')) reason = 'limit_exhausted';
            else if (started('Agent timeout') || job.conclusion === 'timed_out') reason = 'timeout';
            else if (started('Infrastructure failure')) reason = 'infra';
            else if (started('Agent failed') || job.conclusion === 'cancelled') reason = 'agent_failed';
            else if (started('Run OpenCode')) reason = job.conclusion === 'success' ? 'success' : 'agent_failed';
            const number = Number(match[2]);
            let sha = run.head_sha;
            if (match[1] === 'PR') {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
              if (pr.head.repo?.full_name !== context.payload.repository.full_name ||
                  pr.base.repo?.full_name !== context.payload.repository.full_name) return;
              sha = pr.head.sha; // Latest PR version at report time, not the workflow's default-branch SHA.
            }
            const marker = `<!-- opencode-result:${run.id}:${run.run_attempt} -->`;
            const body = [marker, '## Результат запроса OpenCode', '',
              `Статус: **${reason === 'success' ? 'запрос завершён; требуется ревью человека' : 'нужен человек'}**`,
              `Причина: \`${reason}\``, `Последний SHA: \`${sha}\` (на момент отчёта)`,
              `[Логи попытки ${run.run_attempt}](https://github.com/${context.payload.repository.full_name}/actions/runs/${run.id}/attempts/${run.run_attempt})`, '',
              reason === 'limit_exhausted' ? 'Лимит 3/3 исчерпан. Модель, CLI и секрет для этого запроса не использовались.' : '',
              reason === 'timeout' ? 'Вызов остановлен по тайм-ауту. Допущенная попытка расходует бюджет PR.' : '',
              job.conclusion === 'cancelled' ? 'Запрос отменён. Если резервирование началось, попытка расходует бюджет PR.' : '',
              reason === 'infra' ? 'Проверьте подготовку CLI, историю Actions и OPENCODE_API_KEY. Автоматического повтора нет.' : '',
              reason === 'agent_failed' ? 'Сбой или отмена агента; точную причину проверьте по логам.' : '',
              'Следующее действие выбирает человек. Отчёт не подтверждает тесты и не разрешает мерж.',
            ].filter(Boolean).join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: number, per_page: 100,
            });
            // Only deduplicate our own report; editable comments never supply the budget.
            if (comments.some((comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker))) return;
            await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            await core.summary.addRaw(body).write();
