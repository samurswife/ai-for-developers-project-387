name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise and tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.10.25'
          install_args: --locked

      - name: Install dependencies and Chromium
        run: mise run setup

      - name: Check project
        run: mise run check

      - name: Check Docker deployment
        run: mise run test:docker

  browser-head:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record and verify checkout SHA
        id: checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-head"
          actual="$(git rev-parse HEAD)"
          printf '%s\n' "$actual" | tee "$RUNNER_TEMP/browser-head/checkout-sha.txt"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Install mise and tools
        id: tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.10.25'
          install_args: --locked

      - name: Install dependencies and Chromium
        id: setup
        run: mise run setup

      - name: Verify browser behavior and collect evidence
        id: browser
        env:
          BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/browser-head
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: mise run test:evidence

      - name: Record job outcomes
        if: always()
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP'], 'browser-head')
          directory.mkdir(parents=True, exist_ok=True)
          outcome = {key: os.environ[key] for key in (
              'EXPECTED_HEAD_SHA', 'CHECKOUT_OUTCOME', 'TOOLS_OUTCOME', 'SETUP_OUTCOME', 'BROWSER_OUTCOME')}
          (directory / 'job.json').write_text(json.dumps(outcome, indent=2))
          if not (directory / 'result.json').exists():
              (directory / 'result.json').write_text(json.dumps({'status': 'infra', 'job': outcome}, indent=2))
          if os.environ['BROWSER_OUTCOME'] == 'success':
              result = json.loads((directory / 'result.json').read_text())
              if (result.get('status') != 'passed' or result.get('dirty') is not False
                  or result.get('sha') != os.environ['EXPECTED_HEAD_SHA']
                  or result.get('expected_sha') != os.environ['EXPECTED_HEAD_SHA']):
                  raise RuntimeError('Browser command did not produce successful evidence for this head SHA')
          PY

      - name: Upload browser evidence
        if: always()
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-head
          if-no-files-found: error
          retention-days: 30

      - name: Link browser evidence
        if: always() && steps.artifact.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '\n[Download browser evidence](%s)\n\nExpected head SHA: %s\n' "$ARTIFACT_URL" "$EXPECTED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
