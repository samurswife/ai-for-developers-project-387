name: OpenCode
run-name: "OpenCode ${{ (github.event.pull_request || github.event.issue.pull_request) && 'PR' || 'issue' }} #${{ github.event.issue.number || github.event.pull_request.number }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: opencode-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.comment.user.type == 'User' &&
      github.actor == github.event.comment.user.login &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
    steps:
      - name: Authorize comment and repository
        id: authorize
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            core.setOutput('allowed', 'false');
            const { comment, issue, pull_request: pullRequest } = context.payload;
            if (!comment || comment.user.type !== 'User' || context.actor !== comment.user.login ||
                !['OWNER', 'MEMBER', 'COLLABORATOR'].includes(comment.author_association) ||
                !/(^|\s)\/(?:oc|opencode)(?=\s|$)/i.test(comment.body)) return;
            for (const username of new Set([comment.user.login, process.env.GITHUB_TRIGGERING_ACTOR || context.actor])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username });
              if (!['admin', 'write'].includes(data.permission)) {
                core.notice('Current write/admin permission required for author and rerun initiator.');
                return;
              }
            }
            if (pullRequest || issue?.pull_request) {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: pullRequest?.number ?? issue.number,
              });
              if (pr.state !== 'open' || pr.base.ref !== context.payload.repository.default_branch ||
                  pr.head.repo?.full_name !== context.payload.repository.full_name ||
                  pr.base.repo?.full_name !== context.payload.repository.full_name) return;
            }
            core.setOutput('allowed', 'true');

  opencode:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      # Re-run of this job must not reuse the authorization or budget from an earlier attempt.
      - name: Revalidate request
        id: request
        timeout-minutes: 2
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            core.setOutput('allowed', 'false');
            const { comment, issue, pull_request: pullRequest } = context.payload;
            if (!comment || comment.user.type !== 'User' || context.actor !== comment.user.login ||
                !['OWNER', 'MEMBER', 'COLLABORATOR'].includes(comment.author_association) ||
                !/(^|\s)\/(?:oc|opencode)(?=\s|$)/i.test(comment.body)) return;
            for (const username of new Set([comment.user.login, process.env.GITHUB_TRIGGERING_ACTOR || context.actor])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username });
              if (!['admin', 'write'].includes(data.permission)) {
                core.notice('Current write/admin permission required for author and rerun initiator.');
                return;
              }
            }
            if (pullRequest || issue?.pull_request) {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: pullRequest?.number ?? issue.number,
              });
              if (pr.state !== 'open' || pr.base.ref !== context.payload.repository.default_branch ||
                  pr.head.repo?.full_name !== context.payload.repository.full_name ||
                  pr.base.repo?.full_name !== context.payload.repository.full_name) return;
            }
            core.setOutput('allowed', 'true');

      # A started reservation is the durable admission record, even if cancelled or timed out here.
      - name: Reserve PR attempt
        if: steps.request.outputs.allowed == 'true'
        id: budget
        timeout-minutes: 3
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REQUEST_KIND: ${{ (github.event.pull_request || github.event.issue.pull_request) && 'PR' || 'issue' }}
          REQUEST_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        with:
          script: |
            core.setOutput('allowed', 'false');
            core.setOutput('reason', 'infra');
            if (process.env.REQUEST_KIND === 'issue') {
              core.setOutput('allowed', 'true');
              core.setOutput('reason', 'issue_request');
              return;
            }
            try {
              const { data: app } = await github.rest.apps.getBySlug({ app_slug: 'opencode-agent' });
              if (app.permissions?.actions !== 'read' || app.permissions?.workflows === 'write') {
                throw new Error('App must have actions: read and no workflow write permission');
              }
              const runId = Number(process.env.GITHUB_RUN_ID);
              const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
              const title = `OpenCode PR #${process.env.REQUEST_NUMBER}`;
              const { data: current } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId });
              if (current.id !== runId || current.run_attempt !== attempt || current.display_title !== title ||
                  current.path !== '.github/workflows/opencode.yml' ||
                  !['issue_comment', 'pull_request_review_comment'].includes(current.event)) throw new Error('Unexpected run identity');
              const history = new Map();
              let total = 0;
              for (let page = 1; page <= 100; page += 1) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: current.workflow_id, per_page: 100, page,
                });
                total = Math.max(total, data.total_count);
                for (const entry of data.workflow_runs) history.set(entry.id, entry);
                if (data.workflow_runs.length < 100) break;
              }
              if (history.size < total || !history.has(runId)) throw new Error('Incomplete Actions history');
              let previous = 0;
              for (const entry of history.values()) {
                if (entry.workflow_id !== current.workflow_id || entry.display_title !== title ||
                    !['issue_comment', 'pull_request_review_comment'].includes(entry.event)) continue;
                if (!Number.isInteger(entry.run_attempt) || entry.run_attempt < 1) throw new Error('Missing run_attempt');
                for (let n = 1; n <= entry.run_attempt; n += 1) {
                  if (entry.id === runId && n === attempt) continue;
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                    ...context.repo, run_id: entry.id, attempt_number: n, per_page: 100,
                  });
                  const reserved = jobs.some((job) => job.name === 'opencode' && job.run_attempt === n &&
                    job.steps?.some((step) => step.name === 'Reserve PR attempt' && step.started_at &&
                      step.status !== 'queued' && step.conclusion !== 'skipped'));
                  if (reserved) previous += 1;
                  if (previous >= 3) break;
                }
                if (previous >= 3) break;
              }
              core.setOutput('used', Math.min(3, previous + 1));
              core.setOutput('reason', previous >= 3 ? 'limit_exhausted' : 'admitted');
              core.setOutput('allowed', previous < 3 ? 'true' : 'false');
              core.notice(`PR budget: ${Math.min(3, previous + 1)}/3; ${previous >= 3 ? 'limit_exhausted' : 'admitted'}`);
            } catch (error) {
              core.setFailed(`Cannot verify PR budget: ${error.message}`);
            }

      - name: Budget exhausted
        if: steps.budget.outputs.reason == 'limit_exhausted'
        run: exit 1

      - name: Checkout trusted default branch
        if: steps.budget.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The retired composite action downloads latest; install its CLI entrypoint reproducibly instead.
      - name: Install OpenCode v1.19.4
        if: steps.budget.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode-linux-x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/anomalyco/opencode/releases/download/v1.19.4/opencode-linux-x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '849bd6b3d959a1d2ef200ed1634a51c79a45ca236aa26665d75debd694805cce' "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar --extract --gzip --no-same-owner --file "$archive" --directory "$RUNNER_TEMP/opencode-bin"
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"

      - name: Verify CLI
        if: steps.budget.outputs.allowed == 'true'
        run: opencode --version

      - name: Run OpenCode
        if: steps.budget.outputs.allowed == 'true'
        id: agent
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OPENCODE_API_KEY" ]]; then
            echo 'reason=infra' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          set +e
          timeout --signal=TERM --kill-after=20s 45m opencode github run > "$RUNNER_TEMP/opencode-cli.log" 2>&1
          result=$?
          set -e
          RESULT="$result" python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          code = int(os.environ['RESULT'])
          log = Path(os.environ['RUNNER_TEMP'], 'opencode-cli.log').read_text(errors='replace')
          key = os.environ.get('OPENCODE_API_KEY', '')
          if key:
              log = log.replace(key, '[REDACTED]')
          log = re.sub(r'(?i)Bearer\s+[^\s"\x27]+', 'Bearer [REDACTED]', log)
          print(log)
          reason = 'success' if code == 0 else 'agent_failed'
          if code in (124, 137):
              reason = 'timeout'
          elif code != 0 and re.search(r'(?i)unauthorized|authentication|invalid.{0,20}(?:key|token)|insufficient.{0,20}(?:credit|balance)|billing', log):
              reason = 'infra'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'reason={reason}\n')
          PYTHON
          exit "$result"
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode/minimax-m3
          OPENCODE_CONFIG_CONTENT: '{"small_model":"opencode/minimax-m3"}'
          SHARE: 'false'
          USE_GITHUB_TOKEN: 'false'

      # These terminal markers let the model-free reporter classify results after this runner stops.
      - name: Agent timeout
        if: always() && steps.agent.outputs.reason == 'timeout'
        run: exit 1

      - name: Infrastructure failure
        if: always() && steps.agent.outputs.reason == 'infra'
        run: exit 1

      - name: Agent failed
        if: always() && (steps.agent.outputs.reason == 'agent_failed' || (steps.agent.outcome == 'failure' && steps.agent.outputs.reason == ''))
        run: exit 1
